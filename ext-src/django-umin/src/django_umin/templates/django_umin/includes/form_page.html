<div class="max-w-3xl">
    <div class="mb-6">
        {% if breadcrumb_url and breadcrumb_label %}
        <div class="flex items-center space-x-2 text-sm text-gray-500 mb-2">
            <a href="{{ breadcrumb_url }}" class="hover:text-gray-700">{{ breadcrumb_label }}</a>
            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
            </svg>
            <span>{{ action }}</span>
        </div>
        {% endif %}
        <h2 class="text-3xl font-bold text-gray-900">{{ form_title }}</h2>
    </div>

    {% include "django_umin/includes/form_card.html" %}
</div>
